name: Build TIPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect and Process
        run: |
          mkdir -p Payload

          # 1. Если загружен готовый .ipa файл
          IPA_FILE=$(find . -maxdepth 2 -name "*.ipa" | head -n 1)
          if [ -n "$IPA_FILE" ]; then
            echo "Найден готовый .ipa файл: $IPA_FILE"
            cp "$IPA_FILE" app.tipa
            echo "Файл готов!"
            exit 0
          fi

          # 2. Распаковываем zip архивы
          unzip -o *.zip || true

          # 3. Ищем готовый .app
          APP_DIR=$(find . -name "*.app" -not -path "*/build/*" | head -n 1)
          if [ -n "$APP_DIR" ]; then
            echo "Найден готовый .app: $APP_DIR"
            cp -R "$APP_DIR" Payload/
            zip -r app.tipa Payload/
            exit 0
          fi

          # 4. Ищем .xcworkspace или .xcodeproj
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/.*" | head -n 1)
          PROJ=$(find . -name "*.xcodeproj" -not -path "*/.*" | head -n 1)

          if [ -n "$WORKSPACE" ]; then
            echo "Найден workspace: $WORKSPACE"
            BUILD_ARG="-workspace \"$WORKSPACE\""
            SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag' | head -n 1 | xargs)
          elif [ -n "$PROJ" ]; then
            echo "Найден project: $PROJ"
            BUILD_ARG="-project \"$PROJ\""
            SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag' | head -n 1 | xargs)
          else
            echo "=== СОДЕРЖИМОЕ ВАШЕГО АРХИВА ==="
            find . -maxdepth 4
            echo "----------------------------------------"
            echo "ОШИБКА: Проект Xcode не найден."
            exit 1
          fi

          echo "Сборка схемы: $SCHEME"

          eval xcodebuild clean build \
            $BUILD_ARG \
            -scheme \"$SCHEME\" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=\"\" \
            ENTITLEMENTS_REQUIRED=NO

          BUILT_APP=$(find build -name "*.app" | head -n 1)
          cp -R "$BUILT_APP" Payload/
          zip -r app.tipa Payload/

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: app-tipa
          path: app.tipa
