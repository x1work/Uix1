name: Build TIPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Archive
        run: |
          unzip -o *.zip || true

      - name: Build or Package App
        run: |
          mkdir -p Payload
          
          # 1. Проверяем, есть ли в архиве уже готовый .app
          EXISTING_APP=$(find . -name "*.app" -not -path "*/build/*" | head -n 1)
          if [ -n "$EXISTING_APP" ]; then
            echo "Найден готовый .app: $EXISTING_APP"
            cp -R "$EXISTING_APP" Payload/
            zip -r app.tipa Payload/
            exit 0
          fi

          # 2. Если это исходный код, ищем .xcodeproj на любой глубине
          PROJ=$(find . -name "*.xcodeproj" -not -path "*/.*" | head -n 1)
          if [ -z "$PROJ" ]; then
            echo "ОШИБКА: В архиве не найден проект .xcodeproj или файл .app!"
            exit 1
          fi

          PROJ_DIR=$(dirname "$PROJ")
          echo "Найден проект: $PROJ"

          # Проверка и установка CocoaPods (если есть Podfile)
          if [ -f "$PROJ_DIR/Podfile" ]; then
            cd "$PROJ_DIR"
            pod install || true
            cd -
          fi

          # Определение схемы проекта
          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag' | head -n 1 | xargs)
          echo "Используется схема: $SCHEME"

          # Сборка проекта
          xcodebuild clean build \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO

          # Поиск скомпилированного .app
          BUILT_APP=$(find build -name "*.app" | head -n 1)
          if [ -z "$BUILT_APP" ]; then
            echo "ОШИБКА: Не удалось скомпилировать .app"
            exit 1
          fi

          cp -R "$BUILT_APP" Payload/
          zip -r app.tipa Payload/

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: app-tipa
          path: app.tipa
